workflows:
  ios-app-store:
    name: FORT Timer - iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        # Create this group in Codemagic (Teams > your team > Environment variables)
        # and add APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
        # APP_STORE_CONNECT_PRIVATE_KEY (from an App Store Connect API key),
        # plus CERTIFICATE_PRIVATE_KEY if you use manual signing.
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.fortperformance.forttimer"
        XCODE_WORKSPACE: "app-source/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Install web app dependencies
        script: |
          cd app-source
          npm ci
      - name: Build web app + sync into iOS project
        script: |
          cd app-source
          npm run build:ios
      - name: Set up code signing (automatic, via App Store Connect API key)
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $(dirname "$XCODE_WORKSPACE")
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID") + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
